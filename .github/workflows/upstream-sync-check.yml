name: Upstream sync check

# Reports drift against the upstream project this fork tracks — never auto-merges.
# WMM customizations live on this branch; a silent auto-merge could clobber them
# without anyone noticing. This workflow only opens/updates a tracking Issue so a
# human decides how (and whether) to pull each upstream change in.

on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays 13:00 UTC
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch upstream main

      - name: Compute drift
        id: drift
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          AHEAD=$(git rev-list --count upstream/main..HEAD)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"
          git log --oneline HEAD..upstream/main | head -30 > /tmp/commits.txt
          {
            echo "commits<<EOF"
            cat /tmp/commits.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update drift issue
        if: steps.drift.outputs.behind != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const behind = '${{ steps.drift.outputs.behind }}';
            const ahead = '${{ steps.drift.outputs.ahead }}';
            const commits = `${{ steps.drift.outputs.commits }}`;
            const title = `Upstream sync: ${behind} commit(s) behind NousResearch/hermes-agent@main`;
            const body = [
              `This fork's \`main\` branch is **${behind}** commit(s) behind`,
              `[\`NousResearch/hermes-agent\`@\`main\`](https://github.com/NousResearch/hermes-agent/tree/main),`,
              `and carries **${ahead}** commit(s) of WMM-specific changes on top.`,
              '',
              'Newest upstream commits not yet in this branch (most recent first, top 30):',
              '```',
              commits.trim(),
              '```',
              '',
              '**This did not merge anything.** Review the commits above, then rebase or',
              'cherry-pick manually — a straight merge can silently overwrite WMM patches.',
              '',
              `_Auto-generated by \`.github/workflows/upstream-sync-check.yml\`, next run: next Monday._`
            ].join('\n');

            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'upstream-sync', per_page: 20
            });
            const existing = issues.find(i => i.title.startsWith('Upstream sync:'));
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, title, body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['upstream-sync']
              });
            }

      - name: Close drift issue if caught up
        if: steps.drift.outputs.behind == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'upstream-sync', per_page: 20
            });
            for (const i of issues.filter(i => i.title.startsWith('Upstream sync:'))) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, state: 'closed'
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, body: 'Caught up with upstream — closing.'
              });
            }
