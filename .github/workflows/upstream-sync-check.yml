name: Upstream sync check

# Reports drift against the upstream project this fork tracks — never auto-merges.
# WMM customizations live on this branch; a silent auto-merge could clobber them
# without anyone noticing. This workflow only opens/updates a tracking Issue so a
# human decides how (and whether) to pull each upstream change in.
#
# Measured against upstream's latest RELEASE, not upstream/main: main moves
# hundreds of commits a day, so "behind main" is always true and the issue was
# pure noise. The question that matters is "does production run the current
# release?" — and it only escalates once a release has been out > GRACE_DAYS.
#
# Needs Issues enabled on this repo. Until 2026-09-25 they were disabled, so
# every weekly run since 2026-08-31 failed with "Issues has been disabled in
# this repository" and nobody saw it.

on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays 13:00 UTC
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

env:
  UPSTREAM: NousResearch/hermes-agent
  GRACE_DAYS: "7"
  LABEL: upstream-sync

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compare main with the latest upstream release
        id: drift
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r TAG PUBLISHED < <(gh api "repos/${UPSTREAM}/releases/latest" --jq '"\(.tag_name) \(.published_at)"')
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch --no-tags upstream "refs/tags/${TAG}:refs/tags/${TAG}"
          AGE_DAYS=$(( ( $(date -u +%s) - $(date -u -d "${PUBLISHED}" +%s) ) / 86400 ))
          if git merge-base --is-ancestor "${TAG}" HEAD; then CONTAINS=true; else CONTAINS=false; fi
          BEHIND=$(git rev-list --count "HEAD..${TAG}")
          AHEAD=$(git rev-list --count "${TAG}..HEAD")
          echo "Latest release ${TAG} (published ${PUBLISHED}, ${AGE_DAYS}d ago); main contains it: ${CONTAINS}; behind=${BEHIND} ahead=${AHEAD}"
          {
            echo "tag=${TAG}"
            echo "published=${PUBLISHED}"
            echo "age_days=${AGE_DAYS}"
            echo "contains=${CONTAINS}"
            echo "behind=${BEHIND}"
            echo "ahead=${AHEAD}"
          } >> "$GITHUB_OUTPUT"

      - name: Open or update drift issue
        if: steps.drift.outputs.contains == 'false' && fromJSON(steps.drift.outputs.age_days) > fromJSON(env.GRACE_DAYS)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.drift.outputs.tag }}
          PUBLISHED: ${{ steps.drift.outputs.published }}
          AGE_DAYS: ${{ steps.drift.outputs.age_days }}
          BEHIND: ${{ steps.drift.outputs.behind }}
          AHEAD: ${{ steps.drift.outputs.ahead }}
        run: |
          set -euo pipefail
          gh label create "${LABEL}" --color FBCA04 --description "Fork is behind the latest upstream release" --force >/dev/null
          TITLE="Upstream sync: main is missing ${TAG} (released ${AGE_DAYS} days ago)"
          cat > /tmp/body.md <<EOF
          \`main\` does not contain upstream's latest release **[\`${TAG}\`](https://github.com/${UPSTREAM}/releases/tag/${TAG})**,
          published ${PUBLISHED} (${AGE_DAYS} days ago, grace is ${GRACE_DAYS}).
          It is ${BEHIND} commit(s) behind that tag and carries ${AHEAD} commit(s) the tag does not have.

          Production (Railway service \`hermes\`, G Dog) runs whatever commit
          \`Web-My-Money/hermes-agent-railway\` pins in \`HERMES_AGENT_REF\`, so this is also
          how far behind the live bot is once the pin is bumped.

          **This did not merge anything.** To catch up: branch from \`${TAG}\`, cherry-pick the
          WMM patches (\`git log --oneline ${TAG}..main --no-merges\`), run the telegram gateway
          tests, then land it on \`main\` as a merge commit whose tree equals that branch (never
          force-push), and bump \`HERMES_AGENT_REF\` in the wrapper by PR.

          _Auto-generated by \`.github/workflows/upstream-sync-check.yml\` (Mondays 13:00 UTC)._
          EOF
          EXISTING=$(gh issue list --label "${LABEL}" --state open --json number --jq '.[0].number // empty')
          if [ -n "${EXISTING}" ]; then
            gh issue edit "${EXISTING}" --title "${TITLE}" --body-file /tmp/body.md
          else
            gh issue create --title "${TITLE}" --body-file /tmp/body.md --label "${LABEL}"
          fi

      - name: Close drift issue if caught up
        if: steps.drift.outputs.contains == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.drift.outputs.tag }}
        run: |
          set -euo pipefail
          for n in $(gh issue list --label "${LABEL}" --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "main contains ${TAG} (latest upstream release) — closing."
          done
